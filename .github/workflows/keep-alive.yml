name: Arabians Render Keep-Alive 24/7

on:
  schedule:
    # Run every 10 minutes (UTC) to keep Render service awake 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Ping to Arabians Render Server
        run: |
          curl -s -f -m 30 https://arabians-shopping-zone.onrender.com/api/health || true
